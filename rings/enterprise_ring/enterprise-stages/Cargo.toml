[package]
name = "enterprise-stages"
description = "Pulse Mesh — enterprise_ring stages layer: the wire transport's frames over TLS 1.3 on TCP (rustls), with the DTLS and QUIC-tunnel modes deferred."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true

# Some public entry points return a deferred error; the crate docs open with
