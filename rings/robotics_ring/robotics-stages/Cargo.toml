[package]
name = "robotics-stages"
description = "Pulse Mesh — robotics_ring stages layer: the out-of-band large-payload pool in shared memory, a UDP transport over io_uring with a pool of persistent TCP flows, and lag-driven ring autoscaling, which resizes a ring by replacing it under its name."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
robotics-core = { path = "../robotics-core" }
robotics-functions = { path = "../robotics-functions" }
pulse-canon = { path = "../../../../pulse-mesh/pulse/pulse-canon" }
core-region = { path = "../../../../pulse-mesh/core/core-region" }
core-ring = { path = "../../../../pulse-mesh/core/core-ring" }
crc32c.workspace = true
libc.workspace = true
# `all` for SO_REUSEPORT on a flow's socket.
socket2 = { workspace = true, features = ["all"] }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
