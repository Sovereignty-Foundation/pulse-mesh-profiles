[package]
name = "pms-telemetry"
description = "Pulse Mesh scheduling-pressure probes for the hft ring's wait strategies: a PSI probe reading /proc/pressure/cpu on Linux, and an adaptive strategy that parks while pressure is high."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
rust-version.workspace = true
publish.workspace = true

keywords = ["pulse-mesh", "telemetry", "observability"]
categories = ["concurrency"]
[dependencies]
hft-hub = { path = "../../rings/hft_ring/hft-hub" }
thiserror.workspace = true

[features]
default = ["psi"]
psi = []           # /proc/pressure/cpu — Linux 4.20+

[lints]
workspace = true
